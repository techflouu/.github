name: "Read Secrets"
description: "Generate config files (.env, keys, etc.) with demeter from Vault (backend: vault) or GCP Secret Manager (backend: gsm). Both backends need the caller job to grant id-token: write."

inputs:
  target:
    description: "Target environment (stg, prod)"
    required: true
    type: string
  release-tag:
    description: "Release tag/version to inject into config files"
    required: false
    type: string
    default: "v1.0.0"
  backend:
    description: "Secret store demeter reads (vault, gsm)"
    required: false
    type: string
    default: "vault"
  ts-oauth-secret:
    description: "Tailscale OAuth secret (required when backend is vault)"
    required: false
    type: string
  vault-addr:
    description: "Vault address (required when backend is vault)"
    required: false
    type: string
  vault-role:
    description: "Vault role for authentication (required when backend is vault)"
    required: false
    type: string
  gcp-project:
    description: "GCP project that holds the secrets (backend gsm)"
    required: false
    type: string
    default: "journeyflouu"
  gcp-workload-identity-provider:
    description: "Workload Identity Federation provider resource name (required when backend is gsm)"
    required: false
    type: string
  gcp-service-account:
    description: "Service account the workflow impersonates (required when backend is gsm)"
    required: false
    type: string
  nomad-token:
    description: "Nomad token written to nomad.token (required when backend is gsm and target is stg)"
    required: false
    type: string
  ts-tag:
    description: "Tailscale ACL tag for the CI node"
    required: false
    type: string
    default: "ci-journey"

outputs:
  generated-config-path:
    description: "Path to the generated configfile"
    value: ${{ steps.generated-config.outputs.generated-config-path || steps.generated-config-gsm.outputs.generated-config-path }}

runs:
  using: "composite"
  steps:
    - name: Check inputs
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        TARGET: ${{ inputs.target }}
        TS_OAUTH_SECRET: ${{ inputs.ts-oauth-secret }}
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_ROLE: ${{ inputs.vault-role }}
        GCP_PROJECT: ${{ inputs.gcp-project }}
        GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-workload-identity-provider }}
        GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
        NOMAD_TOKEN: ${{ inputs.nomad-token }}
      run: bash "${{ github.action_path }}/check-inputs.sh"

    - name: Get OIDC ID Token
      id: get-token
      if: inputs.backend == 'vault'
      uses: actions/github-script@v7
      with:
        script: |
          const idToken = await core.getIDToken('${{ inputs.vault-addr }}');
          core.setOutput('id_token', idToken);

    - name: Install Vault CLI
      if: inputs.backend == 'vault'
      shell: bash
      run: |
        # A self-hosted runner keeps the CLI from an earlier job.
        if command -v vault >/dev/null 2>&1; then
          echo "Vault CLI is already installed"
          exit 0
        fi

        echo "🔧 Installing Vault CLI..."
        wget -O - https://apt.releases.hashicorp.com/gpg | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get install -y vault
        echo "✅ Vault CLI installed successfully"

    # The self-hosted runners are already on the tailnet. Hosted runners
    # still join it to reach Vault.
    - name: Connect to Private Network via Tailscale
      if: inputs.backend == 'vault' && runner.environment != 'self-hosted'
      uses: tailscale/github-action@v3
      with:
        version: 1.84.0
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:${{ inputs.ts-tag }}

    - name: Authenticate with Vault
      if: inputs.backend == 'vault'
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_NAMESPACE: admin
      run: |
        echo "🔐 Authenticating with Vault..."
        VAULT_TOKEN=$(vault write -field=token auth/github-jwt/login role=${{ inputs.vault-role }} jwt=${{ steps.get-token.outputs.id_token }})
        echo "::add-mask::$VAULT_TOKEN"
        echo "VAULT_TOKEN=$VAULT_TOKEN" >> $GITHUB_ENV
        echo "✅ Vault authentication successful"

    - name: Authenticate to Google Cloud
      if: inputs.backend == 'gsm'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Generate config files using demeter
      id: generated-config
      if: inputs.backend == 'vault'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_NAMESPACE: admin
        GENERATED_CONFIG_PATH: ./generated-config
      run: |
        echo "📝 Generating config files for ${{ inputs.target }} environment..."
        
        # Run demeter and move files to target directory
        npx @techflouu/demeter@latest ${{ inputs.target }} $GENERATED_CONFIG_PATH
        echo "✅ Config files generated using demeter"

        # Inject RELEASE_TAG into .env
        echo "RELEASE_TAG=${{ inputs.release-tag }}" >> $GENERATED_CONFIG_PATH/.env
        echo "✅ RELEASE_TAG injected into .env file"

        echo "generated-config-path=$GENERATED_CONFIG_PATH" >> $GITHUB_OUTPUT

    - name: Generate config files using demeter (gsm)
      id: generated-config-gsm
      if: inputs.backend == 'gsm'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GCP_PROJECT: ${{ inputs.gcp-project }}
        GENERATED_CONFIG_PATH: ./generated-config
      run: |
        echo "📝 Generating config files for ${{ inputs.target }} environment from GCP Secret Manager..."

        DEMETER_BACKEND=gsm DEMETER_GCP_PROJECT="$GCP_PROJECT" DEMETER_STRICT=1 npx @techflouu/demeter@2 ${{ inputs.target }} $GENERATED_CONFIG_PATH
        echo "✅ Config files generated using demeter"

        # Inject RELEASE_TAG into .env
        echo "RELEASE_TAG=${{ inputs.release-tag }}" >> $GENERATED_CONFIG_PATH/.env
        echo "✅ RELEASE_TAG injected into .env file"

        echo "generated-config-path=$GENERATED_CONFIG_PATH" >> $GITHUB_OUTPUT

    - name: Generate Nomad token file
      shell: bash
      if: ${{ inputs.backend == 'vault' && inputs.target == 'stg' }}
      env:
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_NAMESPACE: admin
        GENERATED_CONFIG_PATH: ./generated-config
      run: |
        echo "🔐 Generating Nomad token..."
        vault read -field=secret_id nomad/ci/creds/ci > $GENERATED_CONFIG_PATH/nomad.token
        echo "✅ Nomad token generated successfully"

    - name: Write Nomad token file
      if: ${{ inputs.backend == 'gsm' && inputs.target == 'stg' }}
      shell: bash
      env:
        NOMAD_TOKEN: ${{ inputs.nomad-token }}
        GENERATED_CONFIG_PATH: ./generated-config
      run: |
        install -m 600 /dev/null "$GENERATED_CONFIG_PATH/nomad.token"
        printf '%s' "$NOMAD_TOKEN" > "$GENERATED_CONFIG_PATH/nomad.token"
        echo "✅ Nomad token written"

    - name: Mask rendered config values
      shell: bash
      run: bash "${{ github.action_path }}/mask-config-values.sh" ./generated-config

    - name: Verify generated config files
      uses: techflouu/.github/.github/actions/ensure-config-files@main
      with:
        target: ${{ inputs.target }}
        download-artifact: false
        spread-files: false
        config-path: ./generated-config
