name: Test read-secrets masking

on:
  pull_request:
    paths:
      - ".github/actions/read-secrets/**"
      - ".github/actions/ensure-config-files/**"
      - ".github/actions/test-e2e/**"
      - ".github/workflows/test-read-secrets-mask.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mask:
    name: Mask rendered values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert one mask line per fixture value
        run: bash .github/actions/read-secrets/test/mask-config-values.test.sh "$RUNNER_TEMP/fixture"

      - name: Register fixture values with the log masker
        run: bash .github/actions/read-secrets/mask-config-values.sh "$RUNNER_TEMP/fixture"

      - name: Print fixture files
        run: cat "$RUNNER_TEMP/fixture/.env" "$RUNNER_TEMP/fixture/key.json" "$RUNNER_TEMP/fixture/nomad.token"

  log:
    name: Assert masked job log
    needs: mask
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assert the mask job log holds no fixture value
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "Mask rendered values") | .id')
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -o mask-job.log \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs"
          grep -q 'PLAIN=\*\*\*' mask-job.log
          grep -q '"private_key": "\*\*\*"' mask-job.log
          for value in plain-value-1 exported-value-2 "quoted value 3" single-value-4 a=b=c-5 \
            inline-value-6 multi-body-7 esc-line-8 esc-line-9 off-10 key-body-11 \
            array-value-12 ci@fixture.test nomad-token-fixture-14 v9.9.9-fixture; do
            if grep -qF -- "$value" mask-job.log; then
              echo "FAIL: '$value' is visible in the mask job log"
              exit 1
            fi
          done
          echo "PASS: every fixture value prints as *** in the mask job log"
