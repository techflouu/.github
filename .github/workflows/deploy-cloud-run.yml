# Reusable Cloud Run deploy.
#
# This workflow does the deploy only. The calling repo runs release work, such
# as semantic-release, `prisma migrate deploy` and `npm ci`, in its own job first.
#
# Order: Tailscale, Vault (JWT/OIDC), GCP (Workload Identity Federation), Cloud
# Build, `gcloud run deploy`. Cloud Build makes the image because the on-prem
# runners are arm64 and Cloud Run runs linux/amd64 only.
#
# Inputs
#  service_name          Cloud Run service name. Required.
#  gcp_project           GCP project id of the service and the registry.
#                        Required.
#  gcp_project_number    Project number. Used only in the Workload Identity
#                        provider path. Required.
#  region                Cloud Run and Artifact Registry region.
#                        Default asia-southeast1.
#  wif_audience          OIDC audience set on the WIF provider, for example
#                        `techflouu-atomic-engine-gcp`. Required.
#  wif_pool              Workload Identity pool id. Default `github-actions`.
#  wif_provider          Workload Identity provider id. Default
#                        `github-provider`.
#  deploy_service_account
#                        Service account the workflow impersonates. Empty
#                        means `github-actions@<gcp_project>.iam.gserviceaccount.com`.
#  runtime_service_account
#                        Service account the Cloud Run revision runs as. Empty
#                        (default) keeps the current value of the service.
#  tailscale_tag         ACL tag of the CI node, for example `tag:ci-<app>`.
#                        Required. The self-hosted runners are already on the
#                        tailnet and ignore it.
#  vault_role            Vault JWT role, for example `<app>-ci`. Required.
#  vault_secrets         The vault-action `secrets:` block, multi-line. Each
#                        variable it exports with `vault_env_prefix` becomes a
#                        Cloud Run env var without the prefix. Required.
#                        Example:
#                          app/<app>/data/<env>/<service> * | APPENV_ ;
#  vault_env_prefix      Prefix removed from the Vault env vars.
#                        Default `APPENV_`.
#  image                 Full image to deploy. Set it to skip the build and
#                        deploy an image that already exists. Default empty,
#                        which builds.
#  artifact_registry_repo
#                        Artifact Registry repository id. Required for a build.
#  image_name            Image name in the repository. Default service_name.
#  dockerfile            Dockerfile path, relative to build_context.
#                        Default `Dockerfile`.
#  build_context         Build context directory. Default `.`.
#  service_env           More runtime env vars, one `KEY=VALUE` on each line.
#                        They override the Vault env vars. A single-image fleet
#                        sets its service here, for example `SERVICE=<composition>`.
#  timeout_seconds       Cloud Run request timeout. Default 600, which matches
#                        the agent step SLA and the Cloud Tasks dispatch
#                        deadline.
#  max_instances         `--max-instances`. Default 10.
#  concurrency           `--concurrency`. Default 100.
#  extra_flags           More flags for `gcloud run deploy`. The shell splits
#                        them on spaces. Default empty.
#  datadog_service       Sets DD_SERVICE and the other DD_* vars. Empty
#                        (default) writes no DD_* vars. DD_API_KEY comes from
#                        Vault as `<prefix>DD_API_KEY`.
#  datadog_env           DD_ENV when datadog_service is set. Default
#                        `production`.
#  version_label         DD_VERSION. Default the short SHA.
#  runs_on               JSON array for `runs-on`.
#                        Default `["self-hosted","arm64","onprem"]`.
#
# Secrets (the caller passes them; they are not inherited)
#  TS_OAUTH_CLIENT_ID    Tailscale OAuth client id. Required only on a runner
#  TS_OAUTH_SECRET       Tailscale OAuth secret.    that is not on-prem.
#  VAULT_ADDR            Vault address. It is also the JWT audience. Required.
#
# What the caller must set up
#  * The calling job grants `permissions: { id-token: write, contents: read }`.
#  * The deploy service account has artifactregistry.writer,
#    cloudbuild.builds.builder and run.developer in gcp_project.
#  * The WIF provider admits the calling repo.
#  * The Actions settings of this repo let other org repos reuse the workflow.

name: Deploy to Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      gcp_project:
        required: true
        type: string
      gcp_project_number:
        required: true
        type: string
      region:
        type: string
        default: asia-southeast1
      wif_audience:
        required: true
        type: string
      wif_pool:
        type: string
        default: github-actions
      wif_provider:
        type: string
        default: github-provider
      deploy_service_account:
        type: string
        default: ''
      runtime_service_account:
        type: string
        default: ''
      tailscale_tag:
        required: true
        type: string
      vault_role:
        required: true
        type: string
      vault_secrets:
        required: true
        type: string
      vault_env_prefix:
        type: string
        default: APPENV_
      image:
        type: string
        default: ''
      artifact_registry_repo:
        type: string
        default: ''
      image_name:
        type: string
        default: ''
      dockerfile:
        type: string
        default: Dockerfile
      build_context:
        type: string
        default: '.'
      service_env:
        type: string
        default: ''
      timeout_seconds:
        type: number
        default: 600
      max_instances:
        type: number
        default: 10
      concurrency:
        type: number
        default: 100
      extra_flags:
        type: string
        default: ''
      datadog_service:
        type: string
        default: ''
      datadog_env:
        type: string
        default: production
      version_label:
        type: string
        default: ''
      runs_on:
        type: string
        default: '["self-hosted","arm64","onprem"]'
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      VAULT_ADDR:
        required: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      id-token: write # GCP Workload Identity and Vault JWT auth
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy identifiers
        id: ids
        env:
          IMAGE: ${{ inputs.image }}
          REGION: ${{ inputs.region }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
          AR_REPO: ${{ inputs.artifact_registry_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          VERSION_LABEL: ${{ inputs.version_label }}
          DEPLOY_SA: ${{ inputs.deploy_service_account }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short "$GITHUB_SHA")
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "DEPLOY_VERSION=${VERSION_LABEL:-$SHORT_SHA}" >> "$GITHUB_ENV"

          if [ -n "$IMAGE" ]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$AR_REPO" ]; then
              echo "::error::artifact_registry_repo is required unless the image input is supplied"
              exit 1
            fi
            NAME="${IMAGE_NAME:-$SERVICE_NAME}"
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            echo "image=${REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

          echo "deploy_sa=${DEPLOY_SA:-github-actions@${GCP_PROJECT}.iam.gserviceaccount.com}" >> "$GITHUB_OUTPUT"

      # The on-prem runners are already on the tailnet.
      - name: Connect via Tailscale
        if: runner.environment != 'self-hosted'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale_tag }}

      # Vault is reachable only over the tailnet.
      - name: Import secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_ADDR }}
          path: github-jwt
          method: jwt
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: ${{ secrets.VAULT_ADDR }}
          secrets: ${{ inputs.vault_secrets }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp_project }}
          workload_identity_provider: >-
            projects/${{ inputs.gcp_project_number }}/locations/global/workloadIdentityPools/${{ inputs.wif_pool }}/providers/${{ inputs.wif_provider }}
          audience: ${{ inputs.wif_audience }}
          service_account: ${{ steps.ids.outputs.deploy_sa }}

      - name: Setup gcloud CLI
        # An exact version skips the version lookup, which hits the GitHub API rate limit.
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '575.0.1'
          cache: true

      - name: Build and push image via Cloud Build
        if: steps.ids.outputs.build_required == 'true'
        env:
          IMAGE: ${{ steps.ids.outputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
        run: |
          set -euo pipefail
          # The auth step writes gha-creds-*.json into the workspace. Upload a
          # copy without it, whatever the caller's ignore files say.
          STAGE="$RUNNER_TEMP/cloudbuild-context"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -C "$BUILD_CONTEXT" --exclude='gha-creds-*.json' -cf - . | tar -C "$STAGE" -xf -
          if [ -n "$(find "$STAGE" -name 'gha-creds-*.json' -print -quit)" ]; then
            echo "::error::a gha-creds file is still in the staged build context"
            exit 1
          fi

          cat > /tmp/cloudbuild.yaml <<EOF
          steps:
            - name: gcr.io/cloud-builders/docker
              args: ['build', '-f', '${DOCKERFILE}', '-t', '${IMAGE}', '.']
          images:
            - '${IMAGE}'
          options:
            logging: CLOUD_LOGGING_ONLY
          EOF
          gcloud builds submit \
            --project "$GCP_PROJECT" \
            --config /tmp/cloudbuild.yaml \
            "$STAGE"

      # The image holds no secrets. Every runtime env var is set at deploy time.
      - name: Build Cloud Run env-vars file
        env:
          VAULT_ENV_PREFIX: ${{ inputs.vault_env_prefix }}
          SERVICE_ENV: ${{ inputs.service_env }}
          DEPLOY_DD_SERVICE: ${{ inputs.datadog_service }}
          DEPLOY_DD_ENV: ${{ inputs.datadog_env }}
        run: |
          python3 - <<'EOF'
          import os, json, sys

          prefix = os.environ.get('VAULT_ENV_PREFIX') or 'APPENV_'
          out = {}

          for k, v in os.environ.items():
              if k.startswith(prefix):
                  out[k[len(prefix):]] = v

          # service_env goes last so that it overrides the Vault values.
          for line in (os.environ.get('SERVICE_ENV') or '').splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' not in line:
                  sys.exit(f'service_env entry is not KEY=VALUE: {line!r}')
              k, _, v = line.partition('=')
              out[k.strip()] = v

          dd_service = os.environ.get('DEPLOY_DD_SERVICE') or ''
          if dd_service:
              out['DD_SITE'] = 'datadoghq.com'
              out['DD_LOGS_ENABLED'] = 'true'
              out['DD_TRACE_ENABLED'] = 'true'
              out['DD_SERVICE'] = dd_service
              out['DD_ENV'] = os.environ.get('DEPLOY_DD_ENV') or 'production'
              out['DD_VERSION'] = os.environ.get('DEPLOY_VERSION', '')

          # A json.dumps string is a valid YAML double-quoted scalar. Newlines and quotes stay intact.
          with open('/tmp/cloudrun-env.yaml', 'w') as f:
              for k, v in out.items():
                  f.write(f'{k}: {json.dumps(v)}\n')

          print(f'Wrote {len(out)} env vars.')
          EOF

      - name: Deploy to Cloud Run
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE: ${{ steps.ids.outputs.image }}
          REGION: ${{ inputs.region }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
          RUNTIME_SA: ${{ inputs.runtime_service_account }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          SERVICE_CONCURRENCY: ${{ inputs.concurrency }}
          EXTRA_FLAGS: ${{ inputs.extra_flags }}
        run: |
          set -euo pipefail
          # The run number lets a re-run on the same commit use a new revision name.
          # Cloud Tasks calls these services with OIDC. The public internet never does.
          args=(
            --project "$GCP_PROJECT"
            --region "$REGION"
            --image "$IMAGE"
            --revision-suffix "${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            --no-allow-unauthenticated
            --timeout "$TIMEOUT_SECONDS"
            --max-instances "$MAX_INSTANCES"
            --concurrency "$SERVICE_CONCURRENCY"
            --env-vars-file /tmp/cloudrun-env.yaml
          )
          if [ -n "$RUNTIME_SA" ]; then
            args+=(--service-account "$RUNTIME_SA")
          fi
          if [ -n "$EXTRA_FLAGS" ]; then
            # shellcheck disable=SC2206
            args+=($EXTRA_FLAGS)
          fi

          gcloud run deploy "$SERVICE_NAME" "${args[@]}"
