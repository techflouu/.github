name: PR Check Workflow

on:
  workflow_call:
    inputs:
      target-env:
        description: "Target environment for config generation"
        required: false
        type: string
        default: "stg"
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      lint-command:
        description: "NPM script command for linting"
        required: false
        type: string
        default: "npm run lint:ci"
      test-command:
        description: "NPM script command for testing without coverage"
        required: false
        type: string
        default: "npm run test"
      test-cov-command:
        description: "NPM script command for testing with coverage"
        required: false
        type: string
        default: "npm run test:cov"
      pre-check-command:
        description: "Optional command run after install, before lint/test start"
        required: false
        type: string
        default: ""
      ts-tag:
        description: "Tailscale ACL tag for the CI node"
        required: false
        type: string
        default: "ci-journey"
      ts-network:
        description: >-
          Join the tailnet in the test job too, so a test that runs against
          a private resource (a staging database) can reach it. The prepare
          job always joins, to reach Vault; the test job runs on a fresh
          runner and does not, unless this is true. Off by default, so
          callers without such tests pay nothing.
        required: false
        type: boolean
        default: false
      secrets:
        description: >-
          Render config from Vault through Tailscale. When false, the check
          renders config with the caller's `npm run config:ci` script, needs
          no secret, and uploads no artifact.
        required: false
        type: boolean
        default: true
      coverage:
        description: >-
          Run the test-cov-command and post the coverage report when the PR
          title asks for it (feat, fix, perf, revert, major). Set it to false
          for a caller whose PR check runs only the tests a change can
          affect. A whole-repo number from such a run is wrong, and the
          report step fails without a coverage file. Such a caller measures
          coverage on main instead.
        required: false
        type: boolean
        default: true
    secrets:
      TS_AUTHKEY:
        required: false
      VAULT_ADDR:
        required: false
      VAULT_ROLE:
        required: false
      DISCORD_WEBHOOK:
        required: false

jobs:
  prepare-env:
    name: Prepare Environment
    if: inputs.secrets
    runs-on: [self-hosted, linux, ARM64]
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run Release Action
        id: release
        uses: techflouu/.github/.github/actions/release@main
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run Read Secrets Action
        id: read-secrets
        uses: techflouu/.github/.github/actions/read-secrets@main
        with:
          target: ${{ inputs.target-env }}
          release-tag: ${{ steps.release.outputs.version }}
          ts-oauth-secret: ${{ secrets.TS_AUTHKEY }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role: ${{ secrets.VAULT_ROLE }}
          ts-tag: ${{ inputs.ts-tag }}

      - name: Upload config files
        uses: actions/upload-artifact@v4
        with:
          name: config-files-${{ inputs.target-env }}
          path: ${{ steps.read-secrets.outputs.generated-config-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test-and-lint:
    name: Test and Lint
    if: inputs.secrets
    runs-on: [self-hosted, linux, ARM64]
    needs: prepare-env
    outputs:
      error_summary: ${{ steps.run-checks.outputs.error_summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure config files
        uses: techflouu/.github/.github/actions/ensure-config-files@main
        with:
          target: ${{ inputs.target-env }}
          artifact-name: config-files-${{ inputs.target-env }}

      # The self-hosted runners are already on the tailnet.
      - name: Connect to Private Network via Tailscale
        if: inputs.ts-network && runner.environment != 'self-hosted'
        uses: tailscale/github-action@v3
        with:
          version: 1.84.0
          oauth-secret: ${{ secrets.TS_AUTHKEY }}
          tags: tag:${{ inputs.ts-tag }}

      - name: Check Commit Prefix
        id: check-prefix
        env:
          # Through env, never inline in the script: a PR title is text an
          # outside contributor controls.
          TITLE: ${{ github.event.pull_request.title }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          if [[ "$COVERAGE" != "true" ]]; then
            echo "run_coverage=false" >> "$GITHUB_OUTPUT"
            echo "Coverage is off for this caller. Skipping coverage."
          # Conventional-commit scope and breaking-change marker are optional:
          # feat:, feat(vig):, feat!:, and feat(vig)!: all count.
          elif [[ "$TITLE" =~ ^(feat|fix|perf|revert|major)(\([^\)]+\))?!?: ]]; then
            echo "run_coverage=true" >> "$GITHUB_OUTPUT"
            echo "Commit matches primary semantic traits. Enabling coverage."
          else
            echo "run_coverage=false" >> "$GITHUB_OUTPUT"
            echo "Commit is a minor chore or doc update. Skipping coverage."
          fi

      - name: Test and Lint
        id: run-checks
        uses: techflouu/.github/.github/actions/test-and-lint@main
        with:
          coverage: ${{ steps.check-prefix.outputs.run_coverage }}
          node-version: ${{ inputs.node-version }}
          lint-command: ${{ inputs.lint-command }}
          test-command: ${{ inputs.test-command }}
          test-cov-command: ${{ inputs.test-cov-command }}
          pre-check-command: ${{ inputs.pre-check-command }}

      - name: Upload coverage report
        if: always() && steps.check-prefix.outputs.run_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          retention-days: 3

      - name: Fetch base branch coverage
        if: always() && steps.check-prefix.outputs.run_coverage == 'true'
        run: |
          mkdir -p coverage-base
          if git fetch origin badges 2>/dev/null; then
            git show origin/badges:coverage-summary.json > coverage-base/coverage-summary.json || echo "{}" > coverage-base/coverage-summary.json
          else
            echo "{}" > coverage-base/coverage-summary.json
          fi

      - name: "📊 Coverage Report"
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && steps.check-prefix.outputs.run_coverage == 'true'
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          json-summary-compare-path: ./coverage-base/coverage-summary.json
          file-coverage-mode: changes

  test-and-lint-no-secrets:
    name: Test and Lint (No Secrets)
    if: ${{ !inputs.secrets }}
    runs-on: [self-hosted, linux, ARM64]
    permissions:
      contents: read
      packages: read
      pull-requests: write
    outputs:
      error_summary: ${{ steps.run-checks.outputs.error_summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Render CI config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! jq -e '.scripts["config:ci"]' package.json > /dev/null; then
            echo "::error title=Missing config:ci script::secrets is false, so the PR check renders config with 'npm run config:ci'. Add a config:ci script to package.json."
            exit 1
          fi
          npm run config:ci

      - name: Check Commit Prefix
        id: check-prefix
        env:
          # Through env, never inline in the script: a PR title is text an
          # outside contributor controls.
          TITLE: ${{ github.event.pull_request.title }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          if [[ "$COVERAGE" != "true" ]]; then
            echo "run_coverage=false" >> "$GITHUB_OUTPUT"
            echo "Coverage is off for this caller. Skipping coverage."
          # Conventional-commit scope and breaking-change marker are optional:
          # feat:, feat(vig):, feat!:, and feat(vig)!: all count.
          elif [[ "$TITLE" =~ ^(feat|fix|perf|revert|major)(\([^\)]+\))?!?: ]]; then
            echo "run_coverage=true" >> "$GITHUB_OUTPUT"
            echo "Commit matches primary semantic traits. Enabling coverage."
          else
            echo "run_coverage=false" >> "$GITHUB_OUTPUT"
            echo "Commit is a minor chore or doc update. Skipping coverage."
          fi

      - name: Test and Lint
        id: run-checks
        uses: techflouu/.github/.github/actions/test-and-lint@main
        with:
          coverage: ${{ steps.check-prefix.outputs.run_coverage }}
          node-version: ${{ inputs.node-version }}
          lint-command: ${{ inputs.lint-command }}
          test-command: ${{ inputs.test-command }}
          test-cov-command: ${{ inputs.test-cov-command }}
          pre-check-command: ${{ inputs.pre-check-command }}

      - name: Fetch base branch coverage
        if: always() && steps.check-prefix.outputs.run_coverage == 'true'
        run: |
          mkdir -p coverage-base
          if git fetch origin badges 2>/dev/null; then
            git show origin/badges:coverage-summary.json > coverage-base/coverage-summary.json || echo "{}" > coverage-base/coverage-summary.json
          else
            echo "{}" > coverage-base/coverage-summary.json
          fi

      - name: "📊 Coverage Report"
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && steps.check-prefix.outputs.run_coverage == 'true'
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          json-summary-compare-path: ./coverage-base/coverage-summary.json
          file-coverage-mode: changes

  # Discord notifications handled by Vitas bot via workflow_run webhook
