name: Shared Deploy Test and Lint

on:
  workflow_call:
    inputs:
      target-env:
        description: "Target environment (e.g., stg, prod)"
        required: true
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      lint-command:
        description: "NPM script command for linting"
        required: false
        type: string
        default: "npm run lint:ci"
      test-command:
        description: "NPM script command for testing without coverage"
        required: false
        type: string
        default: "npm run test"
      pre-check-command:
        description: "Optional command run after install, before lint/test start"
        required: false
        type: string
        default: ""
      ts-tag:
        description: "Tailscale ACL tag for the CI node"
        required: false
        type: string
        default: "ci-journey"
      ts-network:
        description: >-
          Join the tailnet before the tests, so a test that runs against a
          private resource (a staging database) can reach it. Off by
          default. Needs the TS_AUTHKEY secret.
        required: false
        type: boolean
        default: false
    secrets:
      TS_AUTHKEY:
        required: false

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure config files
        uses: techflouu/.github/.github/actions/ensure-config-files@main
        with:
          target: ${{ inputs.target-env }}
          artifact-name: config-files-${{ inputs.target-env }}

      - name: Connect to Private Network via Tailscale
        if: inputs.ts-network
        uses: tailscale/github-action@v3
        with:
          version: 1.84.0
          oauth-secret: ${{ secrets.TS_AUTHKEY }}
          tags: tag:${{ inputs.ts-tag }}

      - name: Test and Lint
        uses: techflouu/.github/.github/actions/test-and-lint@main
        with:
          node-version: ${{ inputs.node-version }}
          lint-command: ${{ inputs.lint-command }}
          test-command: ${{ inputs.test-command }}
          pre-check-command: ${{ inputs.pre-check-command }}
