name: Shared Deploy Test and Lint

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment the job binds to (stg, prod)"
        required: true
        type: string
      target-env:
        description: "Target environment (e.g., stg, prod)"
        required: true
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "24"
      lint-command:
        description: "NPM script command for linting"
        required: false
        type: string
        default: "npm run lint:ci"
      test-command:
        description: "NPM script command for testing without coverage"
        required: false
        type: string
        default: "npm run test"
      pre-check-command:
        description: "Optional command run after install, before lint/test start"
        required: false
        type: string
        default: ""
      ts-tag:
        description: >-
          Unused. The self-hosted runners are already on the tailnet. Kept so
          existing callers stay valid.
        required: false
        type: string
        default: "ci-journey"
      ts-network:
        description: >-
          Unused. The self-hosted runners are already on the tailnet, so a
          test can reach a private resource (a staging database) without it.
          Kept so existing callers stay valid.
        required: false
        type: boolean
        default: false
    secrets:
      TS_AUTHKEY:
        required: false

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: [self-hosted, linux, ARM64]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure config files
        uses: techflouu/.github/.github/actions/ensure-config-files@ci/self-hosted-runners
        with:
          target: ${{ inputs.target-env }}
          artifact-name: config-files-${{ inputs.target-env }}

      - name: Test and Lint
        uses: techflouu/.github/.github/actions/test-and-lint@ci/self-hosted-runners
        with:
          node-version: ${{ inputs.node-version }}
          lint-command: ${{ inputs.lint-command }}
          test-command: ${{ inputs.test-command }}
          pre-check-command: ${{ inputs.pre-check-command }}
