name: Shared Deploy Prepare

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment the job binds to (stg, prod)"
        required: true
        type: string
      target-env:
        description: "Target environment (e.g., stg, prod)"
        required: true
        type: string
      ts-tag:
        description: "Tailscale ACL tag for the CI node"
        required: false
        type: string
        default: "ci-journey"
    outputs:
      version:
        description: "The version generated by release action"
        value: ${{ jobs.version.outputs.version }}
      short_sha:
        description: "The short sha of the commit"
        value: ${{ jobs.version.outputs.short_sha }}
    secrets:
      TS_AUTHKEY:
        required: true
      VAULT_ADDR:
        required: true
      VAULT_ROLE:
        required: true

jobs:
  # read-secrets masks every config value, and GitHub drops a job output that contains a masked
  # value. The outputs come from this job, which reads no secrets.
  version:
    name: Version
    runs-on: [self-hosted, linux, ARM64]
    outputs:
      version: ${{ steps.release.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Get short sha
        id: sha
        run: echo "short_sha=$(git rev-parse HEAD | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Run Release Action
        id: release
        uses: techflouu/.github/.github/actions/release@ci/self-hosted-runners

  prepare-env:
    name: Prepare Environment
    needs: version
    runs-on: [self-hosted, linux, ARM64]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Read Secrets Action
        id: read-secrets
        uses: techflouu/.github/.github/actions/read-secrets@ci/self-hosted-runners
        with:
          target: ${{ inputs.target-env }}
          release-tag: ${{ needs.version.outputs.version }}
          ts-oauth-secret: ${{ secrets.TS_AUTHKEY }}
          vault-addr: ${{ secrets.VAULT_ADDR }}
          vault-role: ${{ secrets.VAULT_ROLE }}
          ts-tag: ${{ inputs.ts-tag }}

      - name: Upload config files
        uses: actions/upload-artifact@v4
        with:
          name: config-files-${{ inputs.target-env }}
          path: ${{ steps.read-secrets.outputs.generated-config-path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
